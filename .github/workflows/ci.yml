name: Simple CI

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Run Continuous Integration Demo
        run: |
          echo "🔥 GitHub Actions is running"
          echo "Project files:"
          ls -1
          echo "CI completed successfully"

